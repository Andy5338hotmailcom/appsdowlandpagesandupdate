<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #ffffff;
            color: #222222;
            font-family: "Microsoft Yahei", sans-serif;
        }

        .mask {
            min-height: 100vh;
            padding: 40px 20px;
        }

        .page-title {
            text-align: center;
            font-size: 42px;
            margin-bottom: 60px;
        }

        .section {
            max-width: 1000px;
            margin: 0 auto 50px auto;
            background-color: #f7f7f7;
            padding: 30px;
            border-radius: 12px;
        }

        .section h2 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        .section h3 {
            font-size: 20px;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .section p {
            font-size: 16px;
            line-height: 1.8;
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="mask">
        <h1 class="page-title">艺术社团展板更新</h1>

        <!-- 板块1 -->
        <div class="section">
            <h2>当前版本：</h2>
            <h3>14.2.0</h3>
            <p>你目前使用的是最新版本。</p>
        </div>

        <!-- 板块2 -->
        <div class="section">
            <h2>预览频道</h2>
            <h3>目前：</h3>
            <p>正式版</p>
            <h3>预览版本：</h3>
            <p>14.2.1</p>
        </div>

    </div>
</body>
</html>
